services:
  - type: web
    name: pps-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com
      - key: PROPOSAL_URL
        sync: false
      - key: PROFILE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: VAULT_STORAGE_LIMIT_MB
        value: "512"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: HUB_NOTIFY_EMAIL
        sync: false
      - key: DAILY_DIGEST_ENABLED
        value: "true"
      - key: DAILY_DIGEST_EXCLUDE
        value: thomas_ellison
      - key: DAILY_DIGEST_EMAIL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false

  - type: cron
    name: pps-hub-daily-digest
    runtime: python
    # 04–08 UTC ≈ midnight–3am US/Eastern (EDT/EST); code gates actual send window.
    schedule: "0 4-8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_daily_digest.py
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com
      # Optional: set DAILY_DIGEST_FORCE=true and Trigger Run once to test email delivery.