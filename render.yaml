services:
  - type: web
    name: pps-hub
    env: python
    # The commit is written into the image at build time as well as being
    # read from the runtime env, because RENDER_GIT_COMMIT has been arriving
    # empty and a version nobody can see is how "did my push land?" cost real
    # time on 2026-08-21. `|| true` so a missing var can never fail a build.
    buildCommand: pip install -r requirements.txt && (printf '%s' "$RENDER_GIT_COMMIT" > .render-commit || true)
    # Reverted 2026-07-29: single gevent worker caused whole-Hub lag (one
    # slow/non-cooperative call — Claude API, docx/xlsx generation — blocks
    # the *only* process, stalling every unrelated request, not just
    # Pipeline Board). Back to plain sync workers; Pipeline Board's live
    # updates now poll instead of using Socket.IO, so nothing here needs a
    # special worker class again. See pipeline_board.py.
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com
      - key: PROPOSAL_URL
        sync: false
      # PROFILE_URL / MAPBOX / RUNWAY_* removed 2026-08-03 — personal Profile +
      # Route Lab archived under ~/PPS Proposal/personal-storage/ (owner request).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: VAULT_STORAGE_LIMIT_MB
        value: "512"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: HUB_NOTIFY_EMAIL
        sync: false
      - key: DAILY_DIGEST_ENABLED
        value: "true"
      - key: DAILY_DIGEST_EXCLUDE
        value: thomas_ellison
      - key: DAILY_DIGEST_EMAIL
        sync: false
      # Weekly team recap (weekly_recap.py) — the one Hub email that goes TO the
      # team rather than to Thomas. On by default. WEEKLY_RECAP_EXCLUDE is a
      # comma-separated key list and is deliberately EMPTY: Thomas is on the
      # scoreboard with everyone else. He stays out of his own nightly digest
      # (DAILY_DIGEST_EXCLUDE above) so his clicks don't drown out the team's,
      # but an owner who exempts himself from the leaderboard reads exactly the
      # way you would expect it to.
      - key: WEEKLY_RECAP_ENABLED
        value: "true"
      - key: WEEKLY_RECAP_EXCLUDE
        value: ""
      - key: MONDAY_API_TOKEN
        sync: false
      - key: MONDAY_SUB_INFO_BOARD_ID
        value: "672547511"
      # Estimates board notifications are built (estimate_assignments.py) but
      # OFF by default — Thomas found every open item board-wide untouched
      # for 5.5+ months and is reviewing the team's actual process before
      # turning this on (2026-08-10). Flip to "true" to enable.
      - key: ESTIMATE_NOTIFICATIONS_ENABLED
        value: "false"
      # Awarded work (production_link.py) — join of Monday Production Board
      # funnel × Hub docs. Built, then parked 2026-09-04: Thomas does not
      # want Hub touching that board. Code stays. Flip to "true" to restore
      # the page, dashboard card, and guide section.
      - key: PRODUCTION_LINK_ENABLED
        value: "false"

  - type: cron
    name: pps-hub-daily-digest
    runtime: python
    # 04–08 UTC ≈ midnight–3am US/Eastern (EDT/EST); code gates actual send window.
    schedule: "0 4-8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_daily_digest.py
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com
      # Optional: set DAILY_DIGEST_FORCE=true and Trigger Run once to test email delivery.

  - type: cron
    name: pps-hub-weekly-tp-compliance
    runtime: python
    # 12 UTC Monday ≈ 7-8am US/Eastern (EDT/EST).
    schedule: "0 12 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_weekly_tp_compliance.py
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com

  - type: cron
    name: pps-hub-weekly-recap
    runtime: python
    # 11 UTC Monday ≈ 7am US/Eastern (EDT/EST). Lands before the week starts,
    # which is the point — a scoreboard read Monday morning can still change
    # what someone does on Tuesday.
    schedule: "0 11 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_weekly_recap.py
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com
      # Trigger Run is SAFE on any day but Monday morning: run_weekly_recap
      # checks should_run_scheduled() and reports skipped/not_scheduled without
      # emailing anyone, so the obvious way to test this cron cannot spam the
      # team. Set WEEKLY_RECAP_FORCE=true only for a deliberate off-schedule
      # send to all thirteen people.

  - type: cron
    name: pps-hub-weekly-crm-sync
    runtime: python
    # 4 UTC Monday ≈ Sunday ~11pm-midnight US/Eastern (EDT/EST) — Sunday EOD.
    schedule: "0 4 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_weekly_crm_sync.py
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com

  - type: cron
    name: pps-hub-daily-estimate-check
    runtime: python
    # 11 UTC ≈ 7am US/Eastern (EDT/EST).
    schedule: "0 11 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_daily_estimate_check.py
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: HUB_PUBLIC_URL
        value: https://hub.purepropsolutions.com