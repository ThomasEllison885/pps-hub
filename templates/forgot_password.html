<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/static/pps-global.css?v=3">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include '_pwa_head.html' %}
<title>PPS Hub · Forgot Password</title>
<style>
  .wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 64px); padding: 24px 20px 40px; }
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px; width: 100%; max-width: 420px; text-align: center; }
  .card h1 { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--dark-blue); margin-bottom: 8px; }
  .card .sub { font-size: 14px; color: #888; margin-bottom: 28px; }
  .field { text-align: left; margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--dark-blue); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .field select { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; }
  .btn { width: 100%; background: var(--dark-blue); color: white; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .msg { background: #E8F5E9; color: #2E7D32; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; text-align: left; }
  .error { background: #FEE; color: #C00; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; text-align: left; }
  .back { display: inline-block; margin-top: 20px; font-size: 13px; color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<header class="pps-header">
  <div class="pps-header-left">
    <img src="/static/logo.png?v=3" alt="Pure Property Solutions" class="pps-header-logo">
    <div class="pps-header-divider"></div>
    <span class="pps-header-title">PPS Hub</span>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <h1>Forgot Password</h1>
    <p class="sub">We'll email a reset link to the address on file for your account.</p>
    {% if message %}<div class="msg">{{ message }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="field">
        <label>Your Name</label>
        <select name="user_key" required>
          <option value="" disabled selected>Select your name…</option>
          {% for key, user in users %}
          <option value="{{ key }}">{{ user.display }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn">Send Reset Link →</button>
    </form>
    <a href="/login" class="back">← Back to sign in</a>
  </div>
</div>
</body>
</html>
