<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runway · Airline Simulation</title>
<style>
  :root {
    --bg: #060d18;
    --panel: #0f1c2e;
    --border: #1e3a5f;
    --text: #d4e4f4;
    --muted: #6a8fb0;
    --accent: #00c896;
    --gold: #ffd166;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  .start-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .start-wrap h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 2.4rem;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .start-wrap .tag { color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
  .scenario-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 14px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .scenario-card:hover { border-color: var(--accent); }
  .scenario-card strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  .scenario-card span { color: var(--accent); font-size: 0.85rem; }
  .scenario-card p { margin-top: 10px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .game-header h1 { font-size: 1.1rem; color: var(--gold); }
  .hud {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 0.8rem;
  }
  .hud b { color: #fff; }
  .hud .danger { color: var(--danger); }

  .speed-bar {
    display: flex;
    gap: 6px;
    padding: 8px 20px;
    background: #0a1525;
    border-bottom: 1px solid var(--border);
  }
  .speed-bar button, .btn, .btn.secondary {
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .speed-bar button.active, .btn { background: var(--accent); color: #042; border-color: var(--accent); }
  .btn.secondary { background: transparent; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .game-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    min-height: calc(100vh - 120px);
  }
  @media (max-width: 900px) {
    .game-layout { grid-template-columns: 1fr; }
  }
  .map-wrap {
    padding: 12px;
    overflow: auto;
  }
  #runway-map { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); }

  .side-panel {
    border-left: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    flex: 1;
    min-width: 60px;
    padding: 10px 6px;
    font-size: 0.72rem;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; padding: 16px; overflow-y: auto; flex: 1; font-size: 0.85rem; line-height: 1.5; }
  .tab-panel.active { display: block; }
  .tab-panel h3, .tab-panel h4 { font-size: 0.95rem; margin-bottom: 8px; color: var(--gold); }
  .muted { color: var(--muted); }
  .stat-dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 12px 0; font-size: 0.8rem; }
  .stat-dl dt { color: var(--muted); }
  .list { list-style: none; }
  .list li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-bottom: 12px; }
  .data-table th, .data-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: left; }
  .form-grid { display: grid; gap: 8px; margin: 10px 0; }
  .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; color: var(--muted); }
  .form-grid input, .form-grid select, #airport-panel input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  #airport-panel { padding: 16px; border-bottom: 1px solid var(--border); }
  #airport-panel h3 { font-size: 1rem; color: var(--gold); }
  #pause-banner {
    display: none;
    background: #3d1515;
    color: #ffb4b4;
    text-align: center;
    padding: 8px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
  }
  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="start-wrap">
    <h1>Runway</h1>
    <p class="tag">A startup airline simulation — real airports, real financing mechanics, razor-thin margins.</p>
    <p class="muted" style="margin-bottom:24px;">MVP v0.1 · Present-day map · 55 airports · 3 scenarios · equity, debt, bonds</p>
    <div id="scenario-list"></div>
  </div>
</div>

<div id="screen-game" class="screen">
  <div id="pause-banner"></div>
  <header class="game-header">
    <div>
      <h1 id="hud-airline">Airline</h1>
    </div>
    <div class="hud">
      <span>Cash <b id="hud-cash">$0</b></span>
      <span>Runway <b id="hud-runway" class="danger">—</b></span>
      <span>Date <b id="hud-date">—</b></span>
      <span>Equity <b id="hud-equity">—</b></span>
      <span>Rep <b id="hud-rep">0</b></span>
      <span>Fuel <b id="hud-fuel">—</b></span>
      <span>LTM Rev <b id="hud-ltm">$0</b></span>
      <span>Daily P&L <b id="hud-pnl">$0</b></span>
    </div>
    <button class="btn secondary" onclick="Runway.reset()">New game</button>
  </header>
  <div class="speed-bar">
    <span style="align-self:center;color:var(--muted);font-size:0.75rem;margin-right:8px;">Time</span>
    <button data-speed="pause">Pause</button>
    <button data-speed="day">Day</button>
    <button data-speed="week">Week</button>
    <button data-speed="month">Month</button>
    <button data-speed="year">Year</button>
  </div>
  <div class="game-layout">
    <div class="map-wrap">
      <svg id="runway-map" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <aside class="side-panel">
      <div id="airport-panel"><p class="muted">Click an airport on the map.</p></div>
      <nav class="tabs">
        <button data-tab="finance" class="active">Finance</button>
        <button data-tab="fleet">Fleet</button>
        <button data-tab="routes">Routes</button>
        <button data-tab="events">Log</button>
      </nav>
      <div id="panel-finance" class="tab-panel active"><div id="tab-finance"></div></div>
      <div id="panel-fleet" class="tab-panel"><div id="tab-fleet"></div></div>
      <div id="panel-routes" class="tab-panel"><div id="tab-routes"></div></div>
      <div id="panel-events" class="tab-panel"><div id="tab-events"></div></div>
    </aside>
  </div>
</div>

<script>window.RUNWAY_BOOTSTRAP = {{ bootstrap_json | safe }};</script>
<script src="/static/runway/game.js"></script>
</body>
</html>
