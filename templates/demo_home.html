<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="/static/pps-global.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPS Hub · Demo</title>
<style>
  body { font-family: 'DM Sans', sans-serif; background: #F0F6FB; color: #334; margin: 0; }

  </main>
