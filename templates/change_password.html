<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/static/pps-global.css?v=3">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPS Hub · Change Password</title>
<style>
  .wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 64px); padding: 24px 20px 40px; }
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px; width: 100%; max-width: 420px; }
  .card h1 { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--dark-blue); margin-bottom: 8px; }
  .card .sub { font-size: 14px; color: #888; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--dark-blue); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; }
  .btn { width: 100%; background: var(--dark-blue); color: white; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .error { background: #FEE; color: #C00; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Change Your Password</h1>
    <p class="sub">You're using a temporary password. Set a new one before continuing.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="field"><label>Current Password</label><input type="password" name="current_password" required></div>
      <div class="field"><label>New Password</label><input type="password" name="new_password" minlength="8" required></div>
      <div class="field"><label>Confirm New Password</label><input type="password" name="confirm_password" minlength="8" required></div>
      <button type="submit" class="btn">Save Password →</button>
    </form>
  </div>
</div>
</body>
</html>
