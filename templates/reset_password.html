<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/static/pps-global.css?v=4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
{% include '_pwa_head.html' %}
<title>PPS Hub · Reset Password</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg, #F2F7FB); -webkit-text-size-adjust: 100%; }

  .wrap {
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100dvh;
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .card {
    background: #fff; border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0, 40, 80, 0.1);
    padding: 22px 18px 24px; width: 100%; max-width: 420px; text-align: center;
  }
  .card h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 1.4rem; color: var(--dark-blue, #003366); margin: 0 0 16px;
  }
  .field { text-align: left; margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.72rem; font-weight: 700;
    color: var(--dark-blue, #003366); text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 8px;
  }
  .password-wrap { position: relative; }
  .password-wrap input {
    width: 100%; min-height: 48px; padding: 12px 52px 12px 14px;
    border: 1.5px solid var(--border, #e2e8f0); border-radius: 10px;
    font-size: 1rem; font-family: inherit; color: var(--gray, #334155);
    background: #fff; outline: none; -webkit-appearance: none; appearance: none;
  }
  .password-wrap input:focus {
    border-color: var(--blue, #004C8C);
    box-shadow: 0 0 0 3px rgba(0, 76, 140, 0.12);
  }
  .toggle-pw {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    min-width: 44px; min-height: 44px; border: none; background: transparent;
    color: var(--blue, #004C8C); font-size: 0.8rem; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  .btn {
    width: 100%; min-height: 52px; background: var(--dark-blue, #003366);
    color: #fff; border: none; padding: 14px 16px; border-radius: 10px;
    font-size: 1.05rem; font-weight: 700; font-family: inherit; cursor: pointer;
    margin-top: 8px; touch-action: manipulation;
  }
  .btn:disabled { opacity: 0.7; }
  .error {
    background: #FEE; color: #B91C1C; border-radius: 10px;
    padding: 12px 14px; font-size: 0.9rem; margin-bottom: 16px; text-align: left; line-height: 1.45;
  }
  .back {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 16px; min-height: 44px; font-size: 0.95rem; font-weight: 600;
    color: var(--blue, #004C8C); text-decoration: none;
  }
  .hint { font-size: 0.85rem; color: #94a3b8; margin: 0 0 16px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Set New Password</h1>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    {% if token %}
    <p class="hint">Use at least 8 characters. You can show the password while typing on your phone.</p>
    <form method="POST" id="reset-form">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="field">
        <label for="new_password">New password</label>
        <div class="password-wrap">
          <input id="new_password" type="password" name="new_password" minlength="8" required
            autocomplete="new-password" enterkeyhint="next"
            autocapitalize="off" autocorrect="off" spellcheck="false">
          <button type="button" class="toggle-pw" data-for="new_password" aria-label="Show password">Show</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <div class="password-wrap">
          <input id="confirm_password" type="password" name="confirm_password" minlength="8" required
            autocomplete="new-password" enterkeyhint="done"
            autocapitalize="off" autocorrect="off" spellcheck="false">
          <button type="button" class="toggle-pw" data-for="confirm_password" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn" id="reset-submit">Update Password</button>
    </form>
    {% else %}
    <p><a class="back" href="/forgot-password">Request a new reset link</a></p>
    {% endif %}
    <a href="/login" class="back">← Back to sign in</a>
  </div>
</div>
<script>
(function () {
  document.querySelectorAll('.toggle-pw').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-for');
      var input = document.getElementById(id);
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    });
  });
  var form = document.getElementById('reset-form');
  var submit = document.getElementById('reset-submit');
  if (form && submit) {
    form.addEventListener('submit', function () {
      if (submit.disabled) return;
      submit.disabled = true;
      submit.textContent = 'Updating…';
    });
  }
})();
</script>
</body>
</html>
